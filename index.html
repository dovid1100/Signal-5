<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIGNAL">
<link rel="manifest" href="manifest.json">
<title>SIGNAL — Market Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0E1016;color:#E8EDF5;font-family:'IBM Plex Mono',monospace;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0E1016;--surface:#14171F;--surface2:#1A1E2A;--surface3:#222636;
  --border:rgba(255,255,255,.055);--border2:rgba(255,255,255,.10);
  --blue:#3EC9FF;--blue-dim:rgba(62,201,255,.10);--blue-glow:rgba(62,201,255,.20);
  --red:#FF4560;--red-dim:rgba(255,69,96,.12);
  --amber:#FFB020;--amber-dim:rgba(255,176,32,.12);
  --green:#20E090;--green-dim:rgba(32,224,144,.10);
  --purple:#B06EFF;--purple-dim:rgba(176,110,255,.12);
  --muted:rgba(200,210,230,.38);--muted2:rgba(200,210,230,.55);
  --text:#E8EDF5;--text2:rgba(232,237,245,.68);
  --sidebar-w:72px;--header-h:54px;--subbar-h:38px;
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.025) 3px,rgba(0,0,0,.025) 4px)}

/* ─ HEADER ─ */
.header{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--header-h);
  background:rgba(14,16,22,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;padding:0 16px;gap:14px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-pulse{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 10px var(--blue)}50%{opacity:.35;box-shadow:0 0 3px var(--blue)}}
.hdr-div{width:1px;height:22px;background:var(--border2);flex-shrink:0}
.hdr-stats{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.stat-pill{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.07em;
  color:var(--muted);text-transform:uppercase;white-space:nowrap}
.stat-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.8s ease-in-out infinite}
.dot-amber{background:var(--amber)}
.stat-pill strong{color:var(--text2);font-weight:500}
.hdr-cd{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border2);
  border-radius:5px;padding:5px 10px}
.hdr-cd-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.hdr-cd-val{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--blue);letter-spacing:.04em}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.api-input{background:var(--surface2);border:1px solid var(--border2);border-radius:5px;
  padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted2);
  width:185px;outline:none;transition:border-color .2s,color .2s}
.api-input:focus{border-color:var(--blue);color:var(--text)}
.api-input::placeholder{color:rgba(255,255,255,.18)}
.btn{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;border:none;border-radius:5px;cursor:pointer;padding:7px 13px;
  transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#080a10}
.btn-primary:hover{background:#72daff;box-shadow:0 0 18px var(--blue-glow)}
.btn-scan{background:var(--surface3);color:var(--text2);border:1px solid var(--border2)}
.btn-scan:hover{border-color:var(--green);color:var(--green)}
.btn-scan:disabled{opacity:.5;cursor:default}
.mobile-status{display:none;align-items:center;gap:8px;font-size:10px;color:var(--muted);flex:1;min-width:0}

/* ─ SUBBAR ─ */
.subbar{position:fixed;top:var(--header-h);left:0;right:0;z-index:190;height:var(--subbar-h);
  background:rgba(20,23,31,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px 0 calc(var(--sidebar-w) + 16px)}
.tab{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:0 14px;height:100%;display:flex;align-items:center;gap:6px;cursor:pointer;
  border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover:not(.active){color:var(--text2)}
.tab-badge{background:var(--blue-dim);color:var(--blue);border-radius:3px;padding:1px 5px;font-size:9px}
.tab-badge-red{background:var(--red-dim);color:var(--red)}
.subbar-sep{width:1px;height:18px;background:var(--border2);margin:0 6px;flex-shrink:0}
.filter-group{display:flex;gap:5px;margin-left:auto}
.chip{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:3px 8px;
  cursor:pointer;transition:all .18s}
.chip.on{color:var(--blue);border-color:var(--blue);background:var(--blue-dim)}
.chip:hover:not(.on){color:var(--text2);border-color:var(--border2)}
#scanStatus{font-size:9px;color:var(--muted);margin-left:10px;white-space:nowrap}

/* ─ SHELL ─ */
.shell{display:flex;padding-top:calc(var(--header-h) + var(--subbar-h));height:100vh}

/* ─ TICKER SIDEBAR ─ */
.ticker-sidebar{position:fixed;top:calc(var(--header-h) + var(--subbar-h));left:0;bottom:0;
  width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border2);
  overflow-y:auto;overflow-x:hidden;z-index:100;scrollbar-width:none}
.ticker-sidebar::-webkit-scrollbar{display:none}
.ticker-item{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;height:60px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .15s;overflow:hidden}
.ticker-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.ticker-item.urg-critical::before{background:var(--red);box-shadow:0 0 10px var(--red)}
.ticker-item.urg-high::before{background:var(--amber)}
.ticker-item.urg-medium::before{background:var(--green)}
.ticker-item:hover{background:var(--surface2)}
.ticker-item.active{background:var(--surface2)}
.ticker-item.active::after{content:'';position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--blue)}
.t-name{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--text)}
.t-move{font-size:9px;font-weight:600}
.move-up{color:var(--green)}.move-dn{color:var(--red)}
@keyframes flash-item{0%{background:rgba(62,201,255,.18)}100%{background:transparent}}
.ticker-item.flash{animation:flash-item .8s ease}

/* ─ DETAIL AREA ─ */
.detail-area{margin-left:var(--sidebar-w);flex:1;overflow-y:auto;padding:28px 32px;
  scrollbar-width:thin;scrollbar-color:var(--surface3) transparent}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px}

/* ─ EMPTY STATE ─ */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:55vh;gap:14px;color:var(--muted);text-align:center}
.empty-icon{font-size:38px;opacity:.3}
.empty-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--muted2)}
.empty-body{font-size:11px;line-height:1.85;max-width:270px}

/* ─ SIGNAL HERO ─ */
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.signal-hero{display:flex;align-items:flex-start;gap:20px;margin-bottom:28px;animation:fade-up .35s ease both}
.hero-badge{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:68px;height:68px;border-radius:10px;font-family:'Syne',sans-serif;font-weight:800;
  font-size:10px;letter-spacing:.10em;text-transform:uppercase;gap:2px}
.badge-critical{background:var(--red-dim);border:1px solid rgba(255,69,96,.3);color:var(--red)}
.badge-high{background:var(--amber-dim);border:1px solid rgba(255,176,32,.3);color:var(--amber)}
.badge-medium{background:var(--green-dim);border:1px solid rgba(32,224,144,.3);color:var(--green)}
.badge-icon{font-size:18px;margin-bottom:2px}
.hero-info{flex:1;min-width:0}
.hero-row{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.hero-ticker{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;letter-spacing:.04em}
.hero-company{font-size:12px;color:var(--muted2);font-style:italic}
.hero-headline{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:10px}
.hero-tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border-radius:3px;padding:3px 8px}
.tag-fda{background:var(--purple-dim);color:var(--purple)}.tag-earn{background:var(--blue-dim);color:var(--blue)}
.tag-ma{background:var(--amber-dim);color:var(--amber)}.tag-short{background:var(--red-dim);color:var(--red)}
.tag-8k{background:var(--green-dim);color:var(--green)}.tag-macro{background:rgba(255,255,255,.06);color:var(--muted2)}
.hero-metrics{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:9px;width:220px}
.metric-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 13px}
.metric-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.metric-val{font-family:'Syne',sans-serif;font-weight:700;font-size:19px}
.metric-sub{font-size:9px;color:var(--muted);margin-top:2px}
.val-green{color:var(--green)}.val-red{color:var(--red)}.val-amber{color:var(--amber)}.val-blue{color:var(--blue)}

/* ─ SECTIONS ─ */
.section{margin-bottom:24px;animation:fade-up .4s ease both}
.section-title{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.conf-track{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:8px}
.conf-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.fill-red{background:linear-gradient(90deg,var(--red),#ff8096)}
.fill-amber{background:linear-gradient(90deg,var(--amber),#ffd580)}
.fill-green{background:linear-gradient(90deg,var(--green),#80ffcc)}
.reasoning-box{background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--blue);
  border-radius:0 8px 8px 0;padding:15px 17px;font-size:12px;color:var(--text2);line-height:1.78}
.reasoning-box em{color:var(--blue);font-style:normal}

/* ─ SOURCES ─ */
.sources-grid{display:flex;flex-direction:column;gap:9px}
.source-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:13px 15px;
  display:flex;align-items:flex-start;gap:12px;transition:border-color .2s,background .2s;
  text-decoration:none;cursor:pointer}
.source-card:hover{border-color:var(--blue);background:var(--surface3)}
.source-icon{width:34px;height:34px;border-radius:6px;background:var(--surface3);
  border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0}
.source-body{flex:1;min-width:0}
.source-pub-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.source-pub{font-size:11px;font-weight:600;color:var(--blue)}
.source-time-label{font-size:9px;color:var(--muted)}
.source-hl{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:5px}
.source-url{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.source-card:hover .source-url{color:var(--blue)}
.source-arrow{font-size:15px;color:var(--muted);flex-shrink:0;margin-top:6px;transition:color .2s,transform .2s}
.source-card:hover .source-arrow{color:var(--blue);transform:translateX(3px)}

/* ─ OUTCOME ─ */
.outcome-card{display:flex;align-items:center;gap:12px;background:var(--surface2);
  border:1px solid var(--border);border-radius:8px;padding:13px 15px}
.outcome-msg{flex:1;font-size:11px;color:var(--muted2);line-height:1.5}
.badge-hit{background:var(--green-dim);color:var(--green);border-radius:4px;padding:4px 10px;font-size:10px;font-weight:600}
.badge-miss{background:var(--red-dim);color:var(--red);border-radius:4px;padding:4px 10px;font-size:10px;font-weight:600}
.badge-pend{background:var(--blue-dim);color:var(--blue);border-radius:4px;padding:4px 10px;font-size:10px;font-weight:600}
.btn-check{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;background:var(--surface3);color:var(--text2);border:1px solid var(--border2);
  border-radius:5px;padding:8px 14px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-check:hover{border-color:var(--blue);color:var(--blue)}
.btn-check:disabled{opacity:.5;cursor:default}

/* ─ MINI SIGNAL ROW (24h + history) ─ */
.hour-group{margin-bottom:22px}
.hour-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.hour-label::after{content:'';flex:1;height:1px;background:var(--border)}
.signal-row-mini{display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:7px;
  cursor:pointer;transition:background .15s,border-color .15s;position:relative;overflow:hidden}
.signal-row-mini::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.signal-row-mini.urg-critical::before{background:var(--red);box-shadow:0 0 8px var(--red)}
.signal-row-mini.urg-high::before{background:var(--amber)}
.signal-row-mini.urg-medium::before{background:var(--green)}
.signal-row-mini:hover{background:var(--surface2);border-color:var(--border2)}
.srm-ticker{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;width:46px;flex-shrink:0}
.srm-headline{flex:1;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srm-move{font-size:12px;font-weight:600;width:52px;text-align:right;flex-shrink:0}
.srm-badge{font-size:9px;font-weight:600;border-radius:3px;padding:2px 7px;flex-shrink:0}

/* ─ HISTORY TOOLBAR ─ */
.history-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.range-btn{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);background:var(--surface2);border:1px solid var(--border);
  border-radius:3px;padding:4px 10px;cursor:pointer;transition:all .18s}
.range-btn.on{color:var(--blue);border-color:var(--blue);background:var(--blue-dim)}
.export-btn{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);background:var(--surface3);border:1px solid var(--border2);
  border-radius:3px;padding:4px 10px;cursor:pointer;transition:all .18s;margin-left:auto}
.export-btn:hover{color:var(--green);border-color:var(--green)}
.history-count{font-size:10px;color:var(--muted)}

/* ─ ANALYTICS ─ */
.analytics-wrap{max-width:680px}
.period-toggle{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.period-btn{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);background:var(--surface2);border:1px solid var(--border);
  border-radius:4px;padding:5px 12px;cursor:pointer;transition:all .18s}
.period-btn.on{color:var(--blue);border-color:var(--blue);background:var(--blue-dim)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px}
.stat-card-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.stat-card-val{font-family:'Syne',sans-serif;font-weight:700;font-size:22px}
.stat-card-sub{font-size:9px;color:var(--muted);margin-top:3px}
.analytics-section{margin-bottom:24px}
.analytics-title{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.analytics-title::after{content:'';flex:1;height:1px;background:var(--border)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-label{font-size:10px;color:var(--text2);width:86px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width 1s ease}
.bar-pct{font-size:10px;font-weight:600;width:38px;text-align:right;flex-shrink:0}
.bar-count{font-size:9px;color:var(--muted);width:22px;flex-shrink:0;text-align:right}
.no-data{font-size:11px;color:var(--muted);text-align:center;padding:40px 0;line-height:1.9}

/* ─ BACK BUTTON ─ */
.back-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;background:var(--surface3);color:var(--muted2);border:1px solid var(--border2);
  border-radius:5px;padding:7px 14px;cursor:pointer;margin-bottom:18px;display:inline-block;transition:all .2s}
.back-btn:hover{border-color:var(--blue);color:var(--blue)}

/* ════════════════════════════════
   MOBILE ≤640px
════════════════════════════════ */
@media(max-width:640px){
  :root{--header-h:50px;--subbar-h:40px;--sidebar-w:0px}
  .header{padding:0 12px;gap:8px}
  .hdr-stats,.hdr-div{display:none}
  .api-input{width:100px;font-size:9px}
  .btn-scan{display:flex;font-size:9px;padding:6px 9px}
  .btn-primary{font-size:9px;padding:6px 9px}
  .mobile-status{display:flex}
  .hdr-cd{padding:4px 8px}
  .hdr-cd-label{display:none}
  .hdr-cd-val{font-size:12px}
  .subbar{padding:0 10px}
  .tab{padding:0 9px;font-size:9px;letter-spacing:.04em}
  .filter-group,.subbar-sep{display:none}
  #scanStatus{display:none}
  .ticker-sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:66px;
    border-right:none;border-top:1px solid var(--border2);display:flex;flex-direction:row;
    overflow-x:auto;overflow-y:hidden;background:rgba(14,16,22,.97);backdrop-filter:blur(20px);padding:0 4px}
  .ticker-item{flex-direction:row;height:66px;width:auto;min-width:66px;padding:0 11px;
    border-bottom:none;border-right:1px solid var(--border);gap:5px;flex-shrink:0}
  .ticker-item::before{left:0;right:0;top:0;bottom:auto;width:auto;height:3px}
  .ticker-item.active::after{display:none}
  .t-name{font-size:12px}.t-move{font-size:9px}
  .detail-area{margin-left:0;padding:14px 14px 82px;height:calc(100vh - var(--header-h) - var(--subbar-h))}
  .signal-hero{flex-direction:column;gap:14px}
  .hero-badge{width:52px;height:52px}.badge-icon{font-size:15px}
  .hero-ticker{font-size:24px}.hero-company{font-size:10px}.hero-headline{font-size:12px}
  .hero-metrics{width:100%;grid-template-columns:1fr 1fr}.metric-val{font-size:17px}
  .source-card{padding:10px 11px;gap:10px}
  .source-icon{width:30px;height:30px;font-size:12px}
  .source-hl{font-size:10px}.source-url{font-size:8px}.source-arrow{display:none}
  .outcome-card{flex-direction:column;align-items:flex-start;gap:9px}
  .btn-check{width:100%;text-align:center}
  .stat-grid{grid-template-columns:1fr 1fr}.analytics-wrap{max-width:100%}
}

/* ─ TABLET ─ */
@media(min-width:641px) and (max-width:1024px){
  :root{--sidebar-w:72px}
  .api-input{width:155px}.btn-scan{display:none}
  .detail-area{padding:20px 24px}
  .hero-ticker{font-size:26px}.hero-metrics{width:185px}.metric-val{font-size:17px}
  .stat-grid{grid-template-columns:1fr 1fr}
}

/* ─ WIDE ─ */
@media(min-width:1400px){
  :root{--sidebar-w:88px}
  .detail-area{padding:36px 52px}
  .hero-ticker{font-size:38px}.hero-metrics{width:250px}.metric-val{font-size:22px}
  .sources-grid{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo"><div class="logo-pulse"></div>SIGNAL</div>
  <div class="hdr-div"></div>
  <div class="hdr-stats">
    <div class="stat-pill" id="marketStatus"><span class="stat-dot dot-amber"></span> Loading...</div>
    <div class="hdr-div"></div>
    <div class="stat-pill"><strong id="signalCount">0</strong>&nbsp;signals today</div>
    <div class="hdr-div"></div>
    <div class="hdr-cd">
      <div class="hdr-cd-label">Next scan</div>
      <div class="hdr-cd-val" id="countdown">--:--</div>
    </div>
    <div id="lastScanTime" style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em"></div>
  </div>
  <div class="mobile-status">
    <div style="width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0"></div>
    <span id="signalCountMobile">0 signals</span>
    <div class="hdr-cd" style="margin-left:auto">
      <div class="hdr-cd-val" id="countdown-mobile">--:--</div>
    </div>
  </div>
  <div class="hdr-right">
    <input class="api-input" id="apiKeyInput" type="password" placeholder="sk-ant-api03-••••••••••" autocomplete="off"/>
    <button class="btn btn-primary" id="connectBtn">Connect</button>
    <button class="btn btn-scan" id="scanBtn">▶ Scan Now</button>
  </div>
</header>

<!-- SUBBAR -->
<div class="subbar">
  <div class="tab active" data-tab="feed">Live Feed <span class="tab-badge tab-badge-red" id="feedBadge">0</span></div>
  <div class="tab" data-tab="h24">24 Hours <span class="tab-badge" id="h24Badge">0</span></div>
  <div class="tab" data-tab="history">History</div>
  <div class="tab" data-tab="analytics">Analytics</div>
  <div class="subbar-sep"></div>
  <div class="filter-group" id="filterGroup">
    <div class="chip on" data-filter="all">All</div>
    <div class="chip" data-filter="critical">Critical</div>
    <div class="chip" data-filter="high">High</div>
    <div class="chip" data-filter="medium">Medium</div>
  </div>
  <span id="scanStatus"></span>
</div>

<!-- APP SHELL -->
<div class="shell">
  <nav class="ticker-sidebar" id="tickerSidebar"></nav>
  <main class="detail-area" id="detailArea"></main>
</div>

<script src="app.js"></script>
<script>
// ─── UI STATE ────────────────────────────────────────────────
window.activeSignalId  = null;
window.activeTab       = 'feed';
window.activeFilter    = 'all';
window.historyRange    = '7d';
window.analyticsPeriod = 'allTime';

// ─── TABS ────────────────────────────────────────────────────
document.querySelectorAll('.tab[data-tab]').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    window.activeTab = t.dataset.tab;
    document.getElementById('filterGroup').style.display = window.activeTab === 'feed' ? '' : 'none';
    renderActiveTab();
  });
});

// ─── FILTER CHIPS ────────────────────────────────────────────
document.querySelectorAll('.chip[data-filter]').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-filter]').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    window.activeFilter = c.dataset.filter;
    renderFeed();
    renderSidebar();
  });
});

// ─── SIDEBAR ────────────────────────────────────────────────
window.renderSidebar = function() {
  const sidebar = document.getElementById('tickerSidebar');
  if (!sidebar) return;
  const order = { critical: 0, high: 1, medium: 2 };
  let sigs = getSignalsToday();
  if (window.activeFilter !== 'all') sigs = sigs.filter(s => s.urgency === window.activeFilter);
  sigs.sort((a, b) => order[a.urgency] - order[b.urgency]);

  if (sigs.length === 0) {
    sidebar.innerHTML = '<div style="padding:16px 6px;text-align:center;font-size:9px;color:var(--muted);line-height:1.9">No<br>signals<br>yet</div>';
    return;
  }
  sidebar.innerHTML = sigs.map(s => `
    <div class="ticker-item urg-${s.urgency} ${s.id === window.activeSignalId ? 'active' : ''}"
         data-id="${s.id}" onclick="selectSignal('${s.id}')">
      <div class="t-name">${s.ticker}</div>
      <div class="t-move ${s.move >= 0 ? 'move-up' : 'move-dn'}">${s.move >= 0 ? '+' : ''}${s.move}%</div>
    </div>`).join('');

  document.getElementById('feedBadge').textContent = sigs.length;
  document.getElementById('signalCount').textContent = getSignalsToday().length;
  const mc = document.getElementById('signalCountMobile');
  if (mc) mc.textContent = getSignalsToday().length + ' signals';
};

window.flashNewSignals = function(ids) {
  ids.forEach(id => {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  });
};

// ─── DETAIL VIEW ─────────────────────────────────────────────
window.renderDetail = function(id) {
  const sig = loadSignals().find(s => s.id === id);
  if (!sig) return;
  window.activeSignalId = id;
  renderSidebar();

  const confClass  = sig.urgency === 'critical' ? 'fill-red' : sig.urgency === 'high' ? 'fill-amber' : 'fill-green';
  const moveClass  = sig.move >= 0 ? 'val-green' : 'val-red';
  const movePfx    = sig.move >= 0 ? '+' : '';
  const badgeIcon  = sig.urgency === 'critical' ? '⚡' : sig.urgency === 'high' ? '▲' : '●';

  const sourcesHtml = sig.sources.map(src => `
    <a class="source-card" href="${src.url}" target="_blank" rel="noopener noreferrer">
      <div class="source-icon">${src.icon}</div>
      <div class="source-body">
        <div class="source-pub-row">
          <div class="source-pub">${src.pub}</div>
          <div class="source-time-label">${src.time}</div>
        </div>
        <div class="source-hl">${src.headline}</div>
        <span class="source-url">${src.url}</span>
      </div>
      <div class="source-arrow">→</div>
    </a>`).join('');

  let outcomeHtml;
  if (sig.outcome === 'hit') {
    outcomeHtml = `<div class="outcome-card"><div class="outcome-msg">${sig.outcomeMsg}</div><span class="badge-hit">HIT ✓</span></div>`;
  } else if (sig.outcome === 'miss') {
    outcomeHtml = `<div class="outcome-card"><div class="outcome-msg">${sig.outcomeMsg}</div><span class="badge-miss">MISS ✗</span></div>`;
  } else if (sig.outcome === 'unverified') {
    outcomeHtml = `<div class="outcome-card"><div class="outcome-msg">${sig.outcomeMsg}</div><a href="https://finance.yahoo.com/quote/${sig.ticker}" target="_blank" style="font-size:10px;color:var(--blue);text-decoration:none;flex-shrink:0">Verify →</a></div>`;
  } else if (isOutcomeCheckReady(sig)) {
    outcomeHtml = `<div class="outcome-card"><div class="outcome-msg">1 hour passed — ready to check.</div><button class="btn-check" id="outcome-btn-${sig.id}" onclick="checkOutcome('${sig.id}')">Check Outcome</button></div>`;
  } else {
    const remain = Math.max(0, 60 - Math.floor((Date.now() - new Date(sig.scannedAt).getTime()) / 60000));
    outcomeHtml = `<div class="outcome-card"><div class="outcome-msg"><span class="badge-pend">PENDING</span>&nbsp; Check available in ${remain} min.</div></div>`;
  }

  document.getElementById('detailArea').innerHTML = `
    <div class="signal-hero">
      <div class="hero-badge badge-${sig.urgency}">
        <div class="badge-icon">${badgeIcon}</div>
        ${sig.urgency.toUpperCase()}
      </div>
      <div class="hero-info">
        <div class="hero-row">
          <div class="hero-ticker">${sig.ticker}</div>
          <div class="hero-company">${sig.company}</div>
        </div>
        <div class="hero-headline">${sig.headline}</div>
        <div class="hero-tags">
          <span class="tag ${sig.catalystTag}">${sig.catalyst}</span>
          <span class="tag tag-macro">${sig.time}</span>
          <span class="tag tag-macro">Vol ${sig.volume}</span>
          <span class="tag tag-macro">${sig.marketCap}</span>
        </div>
      </div>
      <div class="hero-metrics">
        <div class="metric-card">
          <div class="metric-label">Move</div>
          <div class="metric-val ${moveClass}">${movePfx}${sig.move}%</div>
          <div class="metric-sub">Current</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Upside Est.</div>
          <div class="metric-val val-blue">${sig.upside}</div>
          <div class="metric-sub">AI estimate</div>
        </div>
        <div class="metric-card" style="grid-column:span 2">
          <div class="metric-label">Confidence — ${sig.confidence}%</div>
          <div class="conf-track"><div class="conf-fill ${confClass}" style="width:${sig.confidence}%"></div></div>
        </div>
      </div>
    </div>
    <div class="section" style="animation-delay:.05s">
      <div class="section-title">Claude's Reasoning</div>
      <div class="reasoning-box">${sig.reasoning}</div>
    </div>
    <div class="section" style="animation-delay:.10s">
      <div class="section-title">${sig.sources.length} Source${sig.sources.length !== 1 ? 's' : ''} — Tap to verify</div>
      <div class="sources-grid">${sourcesHtml}</div>
    </div>
    <div class="section" style="animation-delay:.15s">
      <div class="section-title">Prediction Outcome</div>
      ${outcomeHtml}
    </div>`;

  document.getElementById('detailArea').scrollTop = 0;
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
};

window.selectSignal = function(id) { window.renderDetail(id); };

// ─── LIVE FEED ────────────────────────────────────────────────
window.renderFeed = function() {
  if (window.activeTab !== 'feed') return;
  let sigs = getSignalsToday();
  if (window.activeFilter !== 'all') sigs = sigs.filter(s => s.urgency === window.activeFilter);
  document.getElementById('feedBadge').textContent = sigs.length;

  if (sigs.length === 0) {
    if (!window.activeSignalId) {
      document.getElementById('detailArea').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📡</div>
          <div class="empty-title">No signals yet today</div>
          <div class="empty-body">Enter your Anthropic API key and tap Scan Now, or wait for the auto-scan (9AM–8PM ET, every 5 min).</div>
        </div>`;
    }
    renderSidebar(); return;
  }
  renderSidebar();
  if (!window.activeSignalId || !sigs.find(s => s.id === window.activeSignalId))
    window.activeSignalId = sigs.sort((a,b) => { const o={critical:0,high:1,medium:2}; return o[a.urgency]-o[b.urgency]; })[0].id;
  window.renderDetail(window.activeSignalId);
};

// ─── 24H TAB ─────────────────────────────────────────────────
function render24h() {
  const sigs = getSignalsLast24h();
  document.getElementById('h24Badge').textContent = sigs.length;
  if (sigs.length === 0) {
    document.getElementById('detailArea').innerHTML = `<div class="empty-state"><div class="empty-icon">🕐</div><div class="empty-title">No signals in last 24h</div><div class="empty-body">Signals from the past 24 hours will appear here grouped by hour.</div></div>`;
    return;
  }
  const groups = {};
  sigs.forEach(s => {
    const et  = new Date(new Date(s.scannedAt).toLocaleString('en-US', { timeZone: 'America/New_York' }));
    const key = et.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', timeZone:'America/New_York' }).replace(/:\d\d\s/,' ');
    if (!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  let html = '';
  for (const [label, group] of Object.entries(groups)) {
    html += `<div class="hour-group"><div class="hour-label">${label}</div>`;
    group.forEach(s => {
      const b = s.outcome==='hit' ? `<span class="srm-badge badge-hit">HIT</span>`
              : s.outcome==='miss'? `<span class="srm-badge badge-miss">MISS</span>`
              : `<span class="srm-badge badge-pend">PEND</span>`;
      html += `<div class="signal-row-mini urg-${s.urgency}" onclick="selectSignalDetail('${s.id}')">
        <div class="srm-ticker">${s.ticker}</div>
        <div class="srm-headline">${s.headline}</div>
        <div class="srm-move ${s.move>=0?'move-up':'move-dn'}">${s.move>=0?'+':''}${s.move}%</div>${b}</div>`;
    });
    html += '</div>';
  }
  document.getElementById('detailArea').innerHTML = `<div style="padding-bottom:16px">${html}</div>`;
}

// ─── HISTORY TAB ─────────────────────────────────────────────
function renderHistory() {
  const rangeMap = { '24h': getSignalsLast24h, '7d': getSignalsLast7d, '30d': getSignalsLast30d };
  const sigs     = (rangeMap[window.historyRange] || getSignalsLast7d)();
  let html = `<div class="history-toolbar">
    <div style="display:flex;gap:5px">
      <div class="range-btn ${window.historyRange==='24h'?'on':''}" onclick="setHistoryRange('24h')">24h</div>
      <div class="range-btn ${window.historyRange==='7d'?'on':''}" onclick="setHistoryRange('7d')">7 Days</div>
      <div class="range-btn ${window.historyRange==='30d'?'on':''}" onclick="setHistoryRange('30d')">30 Days</div>
    </div>
    <span class="history-count">${sigs.length} signal${sigs.length!==1?'s':''}</span>
    <button class="export-btn" onclick="doExportCSV()">↓ Export CSV</button>
  </div>`;
  if (sigs.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-title">No signals in this range</div><div class="empty-body">Signals will build up here as the scanner runs.</div></div>`;
  } else {
    sigs.forEach(s => {
      const b   = s.outcome==='hit'?`<span class="srm-badge badge-hit">HIT</span>`:s.outcome==='miss'?`<span class="srm-badge badge-miss">MISS</span>`:`<span class="srm-badge badge-pend">PEND</span>`;
      const dt  = new Date(s.scannedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'});
      html += `<div class="signal-row-mini urg-${s.urgency}" onclick="selectSignalDetail('${s.id}')">
        <div class="srm-ticker">${s.ticker}</div>
        <div class="srm-headline">${s.headline}</div>
        <div class="srm-move ${s.move>=0?'move-up':'move-dn'}">${s.move>=0?'+':''}${s.move}%</div>
        ${b}<span style="font-size:9px;color:var(--muted);flex-shrink:0">${dt}</span></div>`;
    });
  }
  document.getElementById('detailArea').innerHTML = `<div>${html}</div>`;
}

window.setHistoryRange = function(r) { window.historyRange = r; renderHistory(); };
window.doExportCSV = function() {
  const rangeMap = { '24h': getSignalsLast24h, '7d': getSignalsLast7d, '30d': getSignalsLast30d };
  exportCSV((rangeMap[window.historyRange] || getSignalsLast7d)());
};

// ─── SELECT FROM LIST (with back button) ─────────────────────
window.selectSignalDetail = function(id) {
  window.renderDetail(id);
  const detail = document.getElementById('detailArea');
  const back   = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← Back';
  back.onclick = () => renderActiveTab();
  detail.insertBefore(back, detail.firstChild);
};

// ─── ANALYTICS TAB ───────────────────────────────────────────
window.renderAnalytics = function() {
  if (window.activeTab !== 'analytics') return;
  const analytics = getAnalytics();
  const data      = analytics[window.analyticsPeriod] || analytics.allTime;
  const labels    = { allTime:'All Time', today:'Today', h24:'24 Hours', d7:'7 Days', d30:'30 Days' };

  let html = `<div class="analytics-wrap"><div class="period-toggle">
    ${Object.entries(labels).map(([k,v]) => `<div class="period-btn ${window.analyticsPeriod===k?'on':''}" onclick="setAnalyticsPeriod('${k}')">${v}</div>`).join('')}
  </div>`;

  if (!data) {
    html += `<div class="no-data">No outcomes recorded yet for this period.<br>Outcomes are checked 1 hour after each signal fires.<br>Run the scanner during market hours to build data.</div>`;
  } else {
    html += `<div class="stat-grid">
      <div class="stat-card"><div class="stat-card-label">Hit Rate</div><div class="stat-card-val val-green">${data.overall}%</div><div class="stat-card-sub">${data.total} outcomes</div></div>
      <div class="stat-card"><div class="stat-card-label">Hits</div><div class="stat-card-val val-green">${data.hits}</div><div class="stat-card-sub">of ${data.total}</div></div>
      <div class="stat-card"><div class="stat-card-label">Misses</div><div class="stat-card-val val-red">${data.misses}</div><div class="stat-card-sub">of ${data.total}</div></div>
      <div class="stat-card"><div class="stat-card-label">Pending</div><div class="stat-card-val val-blue">${data.pending}</div><div class="stat-card-sub">awaiting check</div></div>
    </div>`;

    if (data.avgHitMove !== null || data.avgMissMove !== null) {
      html += `<div class="stat-grid" style="grid-template-columns:1fr 1fr;margin-bottom:24px">
        <div class="stat-card"><div class="stat-card-label">Avg Hit Move</div><div class="stat-card-val val-green">${data.avgHitMove!==null?'+'+data.avgHitMove+'%':'—'}</div><div class="stat-card-sub">actual move</div></div>
        <div class="stat-card"><div class="stat-card-label">Avg Miss Move</div><div class="stat-card-val val-red">${data.avgMissMove!==null?data.avgMissMove+'%':'—'}</div><div class="stat-card-sub">actual move</div></div>
      </div>`;
    }

    const tierColors = { critical:'var(--red)', high:'var(--amber)', medium:'var(--green)' };
    html += `<div class="analytics-section"><div class="analytics-title">By Confidence Tier</div>`;
    for (const [tier, d] of Object.entries(data.byUrgency)) {
      if (!d) continue;
      html += `<div class="bar-row"><div class="bar-label">${tier.charAt(0).toUpperCase()+tier.slice(1)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%;background:${tierColors[tier]}"></div></div>
        <div class="bar-pct" style="color:${tierColors[tier]}">${d.pct}%</div>
        <div class="bar-count">${d.total}</div></div>`;
    }
    html += '</div>';

    html += `<div class="analytics-section"><div class="analytics-title">By Catalyst Type</div>`;
    for (const [cat, d] of Object.entries(data.byCatalyst).sort((a,b) => b[1].pct-a[1].pct)) {
      const color = d.pct >= 65 ? 'var(--green)' : d.pct >= 45 ? 'var(--amber)' : 'var(--red)';
      html += `<div class="bar-row"><div class="bar-label">${cat}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%;background:${color}"></div></div>
        <div class="bar-pct" style="color:${color}">${d.pct}%</div>
        <div class="bar-count">${d.total}</div></div>`;
    }
    html += '</div>';

    if (Object.keys(data.byDay).length > 0) {
      html += `<div class="analytics-section"><div class="analytics-title">By Day of Week</div>`;
      for (const day of ['Mon','Tue','Wed','Thu','Fri']) {
        const d = data.byDay[day]; if (!d) continue;
        const color = d.pct >= 65 ? 'var(--green)' : d.pct >= 45 ? 'var(--amber)' : 'var(--red)';
        html += `<div class="bar-row"><div class="bar-label">${day}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%;background:${color}"></div></div>
          <div class="bar-pct" style="color:${color}">${d.pct}%</div>
          <div class="bar-count">${d.total}</div></div>`;
      }
      html += '</div>';
    }

    if (Object.keys(data.byHour).length > 0) {
      html += `<div class="analytics-section"><div class="analytics-title">By Time of Day (ET)</div>`;
      for (const h of Object.keys(data.byHour).map(Number).sort((a,b)=>a-b)) {
        const d = data.byHour[h];
        const label = `${h%12||12}${h<12?'am':'pm'}`;
        const color = d.pct >= 65 ? 'var(--green)' : d.pct >= 45 ? 'var(--amber)' : 'var(--red)';
        html += `<div class="bar-row"><div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%;background:${color}"></div></div>
          <div class="bar-pct" style="color:${color}">${d.pct}%</div>
          <div class="bar-count">${d.total}</div></div>`;
      }
      html += '</div>';
    }
  }
  html += '</div>';
  document.getElementById('detailArea').innerHTML = html;
};

window.setAnalyticsPeriod = function(p) { window.analyticsPeriod = p; window.renderAnalytics(); };

// ─── RENDER ACTIVE TAB ───────────────────────────────────────
window.renderActiveTab = function() {
  window.activeSignalId = null;
  const t = window.activeTab;
  if (t === 'feed')      { renderFeed(); renderSidebar(); }
  else if (t === 'h24')  render24h();
  else if (t === 'history') renderHistory();
  else if (t === 'analytics') window.renderAnalytics();
};

// ─── INIT UI ─────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  renderFeed();
  renderSidebar();
  setInterval(() => {
    if (window.activeTab === 'h24')       render24h();
    if (window.activeTab === 'analytics') window.renderAnalytics();
  }, 60000);
});
</script>
<script>
// ── Service Worker Registration ───────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('[SW] Registered:', reg.scope))
      .catch(err => console.warn('[SW] Registration failed:', err));
  });
}
</script>
</body>
</html>
