<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0A0C12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VERTEX">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>VERTEX — Pre-Event Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:var(--base-font,13px);-webkit-tap-highlight-color:transparent}

:root{
  --bg:#0A0C12;--surface:#13161F;--surface2:#181C28;--surface3:#1E2332;
  --border:rgba(255,255,255,.055);--border2:rgba(255,255,255,.10);
  --accent:#3EC9FF;--accent-dim:rgba(62,201,255,.10);--accent-glow:rgba(62,201,255,.20);
  --red:#FF4560;--red-dim:rgba(255,69,96,.12);
  --amber:#FFB020;--amber-dim:rgba(255,176,32,.12);
  --green:#20E090;--green-dim:rgba(32,224,144,.10);
  --purple:#B06EFF;--purple-dim:rgba(176,110,255,.12);
  --muted:rgba(200,210,230,.38);--muted2:rgba(200,210,230,.55);
  --text:#E8EDF5;--text2:rgba(232,237,245,.68);
  /* Phase 4: header/subbar use CSS variables for light mode */
  --header-bg:rgba(10,12,18,.97);--subbar-bg:rgba(19,22,31,.97);
  --sidebar-w:68px;--header-h:52px;--subbar-h:40px;--base-font:13px;
}

/* Phase 4 fix: light mode covers header/subbar */
[data-theme="light"]{
  --bg:#EFF1F7;--surface:#FFF;--surface2:#F4F6FC;--surface3:#E8ECF5;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.12);
  --muted:rgba(30,40,60,.38);--muted2:rgba(30,40,60,.60);
  --text:#111828;--text2:rgba(17,24,40,.72);
  --header-bg:rgba(239,241,247,.97);--subbar-bg:rgba(244,246,252,.97);
}

body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.02) 3px,rgba(0,0,0,.02) 4px)}
[data-theme="light"] body::after{display:none}

/* HEADER — uses CSS variable */
.header{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--header-h);background:var(--header-bg);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 14px;gap:10px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:.15em;color:var(--accent);display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 10px var(--accent)}50%{opacity:.3;box-shadow:0 0 3px var(--accent)}}
.hdr-div{width:1px;height:22px;background:var(--border2);flex-shrink:0}
.hdr-stats{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.stat-pill{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.stat-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.8s ease-in-out infinite}
.dot-amber{background:var(--amber)}.dot-red{background:var(--red)}
.hdr-cd{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:5px 9px}
.hdr-cd-val{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.04em}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}

/* Phase 4: scan button in header (desktop), hidden on mobile in favor of FAB */
.btn-scan{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--surface3);color:var(--text2);border:1px solid var(--border2);border-radius:5px;cursor:pointer;padding:7px 12px;transition:all .2s;white-space:nowrap}
.btn-scan:hover{border-color:var(--green);color:var(--green)}.btn-scan:disabled{opacity:.5;cursor:default}
.mobile-status{display:none;align-items:center;gap:8px;font-size:10px;color:var(--muted);flex:1;min-width:0}

/* SUBBAR — uses CSS variable */
.subbar{position:fixed;top:var(--header-h);left:0;right:0;z-index:190;height:var(--subbar-h);background:var(--subbar-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px 0 calc(var(--sidebar-w)+8px);overflow-x:auto;scrollbar-width:none}
.subbar::-webkit-scrollbar{display:none}
.tab{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 9px;height:100%;display:flex;align-items:center;gap:5px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text2)}
.tab-badge{background:var(--accent-dim);color:var(--accent);border-radius:3px;padding:1px 5px;font-size:9px}
.tab-badge-red{background:var(--red-dim);color:var(--red)}
.tab-sep{width:1px;height:18px;background:var(--border2);margin:0 3px;flex-shrink:0}
#scanStatus{font-size:9px;color:var(--muted);margin-left:8px;white-space:nowrap;flex-shrink:0}

/* SHELL */
.shell{display:flex;padding-top:calc(var(--header-h)+var(--subbar-h));height:100vh}

/* SIDEBAR */
.signal-sidebar{position:fixed;top:calc(var(--header-h)+var(--subbar-h));left:0;bottom:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border2);overflow-y:auto;overflow-x:hidden;z-index:100;scrollbar-width:none}
.signal-sidebar::-webkit-scrollbar{display:none}
.ticker-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;position:relative;overflow:hidden}
.ticker-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.ticker-item.urg-critical::before{background:var(--red);box-shadow:0 0 8px var(--red)}
.ticker-item.urg-critical{animation:crit-glow 2s ease-in-out infinite}
@keyframes crit-glow{0%,100%{box-shadow:inset 0 0 18px rgba(255,69,96,.07)}50%{box-shadow:inset 0 0 18px rgba(255,69,96,.2)}}
.ticker-item.urg-high::before{background:var(--amber)}.ticker-item.urg-medium::before{background:var(--green)}
.ticker-item:hover,.ticker-item.active{background:var(--surface2)}
.ticker-item.active::after{content:'';position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--accent)}
.t-name{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em}
.t-move{font-size:9px;font-weight:600}.t-type-mini{font-size:7px;color:var(--muted);letter-spacing:.06em}
.move-up{color:var(--green)}.move-dn{color:var(--red)}
@keyframes flash-it{0%{background:rgba(62,201,255,.18)}100%{background:transparent}}
.ticker-item.flash{animation:flash-it .8s ease}

/* DETAIL */
.detail-area{margin-left:var(--sidebar-w);flex:1;overflow-y:auto;padding:22px 26px;scrollbar-width:thin;scrollbar-color:var(--surface3) transparent}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px}

/* ANIMATIONS */
@keyframes slide-up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slide-up .28s cubic-bezier(.32,1.2,.42,1) both}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* SKELETON */
@keyframes skel-shine{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);background-size:400px 100%;animation:skel-shine 1.4s ease infinite;border-radius:4px}
.skeleton-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.skeleton-ticker{width:44px;height:16px;flex-shrink:0}.skeleton-body{flex:1;height:12px}.skeleton-badge{width:36px;height:16px;flex-shrink:0}

/* EMPTY STATES */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50vh;gap:12px;color:var(--muted);text-align:center}
.empty-icon{font-size:36px;opacity:.3}.empty-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--muted2)}.empty-body{font-size:11px;line-height:1.85;max-width:260px;color:var(--muted)}
.empty-signals-wrap{display:flex;flex-direction:column;align-items:flex-start;padding:8px 0}
.empty-signals-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.empty-signals-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.diag-card{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:8px;font-size:11px;line-height:1.7;margin-bottom:8px}
.diag-error{background:#1a0808;border:1px solid rgba(255,69,96,.3)}.diag-info{background:var(--surface2);border:1px solid var(--border2)}
.diag-icon{font-size:18px;flex-shrink:0}.diag-title{font-weight:600;color:var(--text2);margin-bottom:3px}.diag-msg{color:var(--red);font-size:10px;word-break:break-all}.diag-fix{color:var(--amber);font-size:10px}

/* WATCHFILE */
.wf-header{margin-bottom:18px}.wf-title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--text);margin-bottom:3px}.wf-subtitle{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.wf-add-row{display:flex;gap:8px}
.wf-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text);outline:none;transition:border-color .2s;text-transform:uppercase}
.wf-input:focus{border-color:var(--accent)}.wf-input::placeholder{color:var(--muted);text-transform:none}
.wf-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .15s}
.wf-card:hover{border-color:var(--border2);background:var(--surface3)}
.wf-card-resolved{opacity:.55}
.wf-card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wf-intensity-pill{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:4px 9px;flex-shrink:0}
.wf-ticker-big{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--text)}
.wf-days-left{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--muted2);margin-left:auto}
.wf-drug-line{font-size:12px;color:var(--text);font-weight:500;margin-bottom:2px}.wf-for{color:var(--muted);font-weight:400}.wf-company-line{font-size:10px;color:var(--muted);margin-bottom:10px}
.wf-metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.wf-metric-mini{display:flex;flex-direction:column;gap:2px;background:var(--surface3);border-radius:6px;padding:7px 9px}
.wf-metric-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.wf-metric-val{font-family:'Syne',sans-serif;font-weight:700;font-size:13px}
.wf-badge-row{display:flex;gap:5px;flex-wrap:wrap}
.wf-badge{font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:2px 7px}
.wf-badge-opts{background:rgba(62,201,255,.12);color:var(--accent);border:1px solid rgba(62,201,255,.2)}
.wf-badge-ins{background:var(--green-dim);color:var(--green);border:1px solid rgba(32,224,144,.2)}
.wf-badge-dil{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,176,32,.2)}
.wf-section-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:10px}.wf-section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.wf-detail-hero{margin-bottom:16px}.wf-detail-ticker{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--text);margin-bottom:2px}.wf-detail-company{font-size:11px;color:var(--muted2);margin-bottom:4px}.wf-detail-drug{font-size:13px;color:var(--text);font-weight:500;margin-bottom:6px}.wf-detail-pdufa{font-size:11px;color:var(--muted2)}
.wf-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.wf-ds{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 11px}.wf-ds-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}.wf-ds-val{font-family:'Syne',sans-serif;font-weight:700;font-size:14px}
.dilution-warning{background:var(--amber-dim);border:1px solid rgba(255,176,32,.3);border-radius:8px;padding:10px 13px;font-size:11px;color:var(--amber);line-height:1.6;margin-bottom:14px}
.intel-item{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;margin-bottom:6px;font-size:11px;color:var(--text2);line-height:1.5}
.intel-pos{border-left:3px solid var(--green)}.intel-neg{border-left:3px solid var(--red)}
.intel-meta{font-size:9px;color:var(--muted);margin-bottom:3px}.intel-headline{font-size:11px;color:var(--text2)}.intel-link{font-size:9px;color:var(--accent);text-decoration:none;margin-top:4px;display:block}.intel-empty{font-size:10px;color:var(--muted);padding:4px 0}
.btn-outcome{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:8px 12px;cursor:pointer;transition:all .2s;border:none}
.btn-approved{background:var(--green-dim);color:var(--green);border:1px solid rgba(32,224,144,.3)}.btn-approved:hover{background:rgba(32,224,144,.2)}
.btn-rejected{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,69,96,.3)}.btn-rejected:hover{background:rgba(255,69,96,.2)}
.btn-delayed{background:var(--surface3);color:var(--muted2);border:1px solid var(--border2)}

/* TYPE BANNERS */
.type-banner{display:flex;align-items:flex-start;gap:11px;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:10px}
.type-banner span{font-size:20px;flex-shrink:0}
.tb-title{font-size:11px;font-weight:600;margin-bottom:3px}.tb-sub{font-size:10px;color:var(--muted2)}
.type-fda{background:var(--purple-dim);border:1px solid rgba(176,110,255,.25)}.type-fda .tb-title{color:#d4a0ff}
.type-squeeze{background:var(--red-dim);border:1px solid rgba(255,69,96,.25)}.type-squeeze .tb-title{color:var(--red)}
.type-ma{background:var(--amber-dim);border:1px solid rgba(255,176,32,.25)}.type-ma .tb-title{color:var(--amber)}

/* SIGNALS */
.signal-hero{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.hero-badge{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:58px;border-radius:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:9px;letter-spacing:.10em;text-transform:uppercase;gap:2px}
.badge-critical{background:var(--red-dim);border:1px solid rgba(255,69,96,.3);color:var(--red);animation:crit-glow 2s ease-in-out infinite}
.badge-high{background:var(--amber-dim);border:1px solid rgba(255,176,32,.3);color:var(--amber)}
.badge-medium{background:var(--green-dim);border:1px solid rgba(32,224,144,.3);color:var(--green)}
.badge-icon{font-size:16px;margin-bottom:2px}
.hero-info{flex:1;min-width:0}.hero-row{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.hero-ticker{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em}
.hero-company{font-size:11px;color:var(--muted2);font-style:italic}
.hero-headline{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:7px}
.hero-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border-radius:3px;padding:3px 7px}
.tag-fda{background:var(--purple-dim);color:#d4a0ff}.tag-earn{background:var(--accent-dim);color:var(--accent)}
.tag-ma{background:var(--amber-dim);color:var(--amber)}.tag-short{background:var(--red-dim);color:var(--red)}
.tag-8k{background:var(--green-dim);color:var(--green)}.tag-macro{background:rgba(255,255,255,.06);color:var(--muted2)}
.tag-squeeze{background:var(--red-dim);color:var(--red)}
.hero-metrics{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:7px;width:190px}
.metric-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.metric-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.metric-val{font-family:'Syne',sans-serif;font-weight:700;font-size:16px}.metric-sub{font-size:9px;color:var(--muted);margin-top:2px}
.val-green{color:var(--green)}.val-red{color:var(--red)}.val-accent{color:var(--accent)}.val-amber{color:var(--amber)}
.conf-track{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:5px}
.conf-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.fill-red{background:linear-gradient(90deg,var(--red),#ff8096)}.fill-amber{background:linear-gradient(90deg,var(--amber),#ffd580)}.fill-green{background:linear-gradient(90deg,var(--green),#80ffcc)}
.quick-actions{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.qa-btn{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--surface2);color:var(--muted2);border:1px solid var(--border);border-radius:5px;padding:6px 9px;cursor:pointer;transition:all .2s}
.qa-btn:hover{border-color:var(--accent);color:var(--accent)}
.section{margin-bottom:19px;animation:fade-in .4s ease both}
.section-title{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:9px}.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.reasoning-box{background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 14px;font-size:11px;color:var(--text2);line-height:1.78;white-space:pre-wrap}

/* CHART */
.chart-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chart-title{font-size:10px;color:var(--muted2);font-weight:600}
.chart-toggle{display:flex;gap:4px}
.chart-btn{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface3);border:1px solid var(--border);border-radius:3px;padding:3px 7px;cursor:pointer;transition:all .18s}
.chart-btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.chart-canvas-wrap{position:relative;height:148px;width:100%}
canvas.chart-canvas{display:block}
.chart-loading{display:flex;align-items:center;justify-content:center;height:148px;font-size:10px;color:var(--muted)}

/* SOURCES */
.sources-grid{display:flex;flex-direction:column;gap:6px}
.source-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:flex-start;gap:9px;text-decoration:none;transition:border-color .2s}
.source-card:hover{border-color:var(--accent)}
.source-icon{width:28px;height:28px;border-radius:5px;background:var(--surface3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.source-body{flex:1;min-width:0}.source-pub-row{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.source-pub{font-size:11px;font-weight:600;color:var(--accent)}.source-time-label{font-size:9px;color:var(--muted)}
.source-hl{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:3px}
.source-url{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.source-arrow{font-size:12px;color:var(--muted);flex-shrink:0;margin-top:4px;transition:color .2s}.source-card:hover .source-arrow{color:var(--accent)}

/* OUTCOME */
.outcome-card{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.outcome-msg{flex:1;font-size:11px;color:var(--muted2);line-height:1.5}
.badge-hit{background:var(--green-dim);color:var(--green);border-radius:4px;padding:3px 8px;font-size:10px;font-weight:600}
.badge-miss{background:var(--red-dim);color:var(--red);border-radius:4px;padding:3px 8px;font-size:10px;font-weight:600}
.badge-pend{background:var(--accent-dim);color:var(--accent);border-radius:4px;padding:3px 8px;font-size:10px;font-weight:600}
.btn-check{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--surface3);color:var(--text2);border:1px solid var(--border2);border-radius:5px;padding:6px 10px;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.btn-check:hover{border-color:var(--accent);color:var(--accent)}

/* HISTORY */
.history-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.range-btn,.sort-btn{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:4px 8px;cursor:pointer;transition:all .18s}
.range-btn.on,.sort-btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.export-btn{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface3);border:1px solid var(--border2);border-radius:3px;padding:4px 8px;cursor:pointer;transition:all .18s;margin-left:auto}
.export-btn:hover{color:var(--green);border-color:var(--green)}
.signal-row-mini{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:background .15s;position:relative;overflow:hidden}
.signal-row-mini::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.signal-row-mini.urg-critical::before{background:var(--red)}.signal-row-mini.urg-high::before{background:var(--amber)}.signal-row-mini.urg-medium::before{background:var(--green)}
.signal-row-mini:hover{background:var(--surface2)}
.srm-ticker{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;width:48px;flex-shrink:0}
.srm-headline{flex:1;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srm-move{font-size:11px;font-weight:600;width:48px;text-align:right;flex-shrink:0}
.srm-badge{font-size:9px;font-weight:600;border-radius:3px;padding:2px 5px;flex-shrink:0}

/* PORTFOLIO */
.portfolio-wrap{max-width:700px}
.portfolio-total{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:17px;margin-bottom:15px}
.portfolio-total-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.portfolio-total-val{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--text)}
.portfolio-add{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:15px}
.portfolio-add-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.portfolio-input{background:var(--surface3);border:1px solid var(--border2);border-radius:6px;padding:8px 9px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text);outline:none;transition:border-color .2s;flex:1;min-width:80px}
.portfolio-input:focus{border-color:var(--accent)}.portfolio-input::placeholder{color:var(--muted)}
.position-row{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.pos-ticker{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;width:46px;flex-shrink:0}
.pos-shares{font-size:10px;color:var(--muted2);width:54px;flex-shrink:0}.pos-cost{font-size:10px;color:var(--muted2);flex:1}
.pos-gl{font-size:11px;font-weight:600;width:58px;text-align:right;flex-shrink:0;line-height:1.4}
.pos-remove{font-size:10px;color:var(--muted);cursor:pointer;padding:2px 6px;border:1px solid var(--border);border-radius:3px;background:none;font-family:'IBM Plex Mono',monospace;transition:all .2s;flex-shrink:0}
.pos-remove:hover{color:var(--red);border-color:var(--red)}

/* ANALYTICS */
.analytics-wrap{max-width:650px}
.period-toggle{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap}
.period-btn{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:5px 9px;cursor:pointer;transition:all .18s}
.period-btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:15px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px}
.stat-card-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat-card-val{font-family:'Syne',sans-serif;font-weight:700;font-size:18px}.stat-card-sub{font-size:9px;color:var(--muted);margin-top:2px}
.analytics-section{margin-bottom:18px}.analytics-title{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:9px}.analytics-title::after{content:'';flex:1;height:1px;background:var(--border)}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.bar-label{font-size:10px;color:var(--text2);width:90px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width 1s ease}
.bar-pct{font-size:10px;font-weight:600;width:34px;text-align:right;flex-shrink:0}
.bar-count{font-size:9px;color:var(--muted);width:18px;flex-shrink:0;text-align:right}
.no-data{font-size:11px;color:var(--muted);text-align:center;padding:36px 0;line-height:1.9}
.pattern-note{font-size:10px;color:var(--muted2);padding:6px 10px;background:var(--surface2);border-radius:5px;border-left:2px solid var(--purple);margin-bottom:5px;line-height:1.6}
.highlight-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px}
.highlight-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.highlight-ticker{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--text)}
.highlight-detail{font-size:10px;color:var(--muted2);margin-top:3px;line-height:1.6}

/* LEARN */
.learn-wrap{max-width:600px}.learn-header{margin-bottom:20px}.learn-title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--text);margin-bottom:4px}.learn-sub{font-size:11px;color:var(--muted);line-height:1.7}
.learn-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.learn-card-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s}.learn-card-header:hover{background:var(--surface3)}
.learn-icon{font-size:18px;flex-shrink:0}.learn-card-title{flex:1;font-size:13px;font-weight:600;color:var(--text)}.learn-chevron{font-size:10px;color:var(--muted);flex-shrink:0}
.learn-card-body{padding:0 16px 16px;font-size:11px;color:var(--text2);line-height:1.8}.learn-card-body p{margin-bottom:10px}.learn-card-body ul{padding-left:18px;margin-bottom:10px}.learn-card-body li{margin-bottom:4px}

/* SETTINGS */
.settings-wrap{max-width:500px;padding-bottom:32px}
.settings-section{margin-bottom:22px}
.settings-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:9px}.settings-label::after{content:'';flex:1;height:1px;background:var(--border)}
.settings-card{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:14px}
.settings-field{margin-bottom:11px}.settings-field:last-child{margin-bottom:0}
.settings-field-label{font-size:10px;color:var(--muted2);margin-bottom:5px}
.settings-input{width:100%;background:var(--surface3);border:1px solid var(--border2);border-radius:6px;padding:9px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text);outline:none;transition:border-color .2s}
.settings-input:focus{border-color:var(--accent)}.settings-input::placeholder{color:rgba(255,255,255,.18)}
.btn-connect-full{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#080a10;border:none;border-radius:6px;padding:10px;cursor:pointer;transition:all .2s;display:block}
.btn-connect-full:hover{background:#72daff;box-shadow:0 0 18px var(--accent-glow)}
.connect-status{font-size:10px;color:var(--muted);margin-top:6px;min-height:14px;text-align:center}
.settings-hint{font-size:10px;color:var(--muted);line-height:1.7;margin-top:7px}
.settings-meta{font-size:10px;color:var(--muted2);line-height:1.8}.settings-meta span{color:var(--accent)}
.preset-group{display:flex;flex-wrap:wrap;gap:5px}
.preset-btn{font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:5px 8px;cursor:pointer;transition:all .18s}
.preset-btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.settings-slider{width:100%;accent-color:var(--accent);cursor:pointer;margin-top:4px}
.color-group{display:flex;gap:10px}
.color-swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;transition:transform .2s;border:2px solid transparent}
.color-swatch.on{border-color:#fff;transform:scale(1.2)}
.btn-danger{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--red-dim);color:var(--red);border:1px solid rgba(255,69,96,.3);border-radius:6px;padding:9px 13px;cursor:pointer;transition:all .2s;width:100%;margin-bottom:6px}
.btn-secondary{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--surface3);color:var(--muted2);border:1px solid var(--border2);border-radius:6px;padding:9px 13px;cursor:pointer;transition:all .2s;width:100%}
.btn-accent{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--accent);color:#080a10;border:none;border-radius:6px;padding:9px 13px;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.btn-accent:hover{background:#72daff}
.back-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--surface3);color:var(--muted2);border:1px solid var(--border2);border-radius:5px;padding:6px 11px;cursor:pointer;display:inline-block;transition:all .2s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Phase 4: FAB — floating scan button on mobile */
.fab{display:none;position:fixed;bottom:78px;right:16px;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#080a10;border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 20px var(--accent-glow);transition:all .2s;align-items:center;justify-content:center}
.fab:active{transform:scale(.93)}.fab:disabled{opacity:.5}

/* PULL INDICATOR */
.pull-indicator{position:absolute;top:calc(var(--header-h)+var(--subbar-h)+8px);left:50%;transform:translateX(-50%);z-index:300;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:10px;color:var(--muted);opacity:0;transition:opacity .2s;pointer-events:none}

/* mobile-only utility */
.mobile-only{display:none}

/* ══ MOBILE ══ */
@media(max-width:640px){
  :root{--header-h:48px;--subbar-h:38px;--sidebar-w:0px}
  .header{padding:0 10px;gap:7px}
  .hdr-stats,.hdr-div{display:none}
  .mobile-status{display:flex}
  /* Phase 4: hide scan btn on mobile, use FAB instead */
  .btn-scan{display:none}
  .fab{display:flex}
  .hdr-cd{padding:4px 7px}.hdr-cd-val{font-size:11px}
  .subbar{padding:0 4px}
  /* Phase 4: abbreviated tab labels on mobile */
  .tab{padding:0 6px;font-size:9px;letter-spacing:.02em}
  .tab[data-tab="watchfile"]::before{content:"WATCH"}
  .tab[data-tab="watchfile"]{font-size:0}
  .tab[data-tab="watchfile"]::before{font-size:9px}
  .tab[data-tab="signals"]::before{content:"SIG"}
  .tab[data-tab="signals"]{font-size:0}
  .tab[data-tab="signals"]::before{font-size:9px}
  .tab[data-tab="history"]::before{content:"HIST"}
  .tab[data-tab="history"]{font-size:0}
  .tab[data-tab="history"]::before{font-size:9px}
  .tab[data-tab="portfolio"]::before{content:"PORT"}
  .tab[data-tab="portfolio"]{font-size:0}
  .tab[data-tab="portfolio"]::before{font-size:9px}
  .tab[data-tab="analytics"]::before{content:"STATS"}
  .tab[data-tab="analytics"]{font-size:0}
  .tab[data-tab="analytics"]::before{font-size:9px}
  .tab[data-tab="learn"]::before{content:"LEARN"}
  .tab[data-tab="learn"]{font-size:0}
  .tab[data-tab="learn"]::before{font-size:9px}
  /* Phase 4: settings gear stays as-is, now has room */
  .tab[data-tab="settings"]{font-size:13px;padding:0 8px}
  .tab-sep{margin:0 1px}
  /* Mobile sidebar becomes bottom strip */
  .signal-sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:62px;border-right:none;border-top:1px solid var(--border2);display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;background:var(--header-bg);backdrop-filter:blur(20px);padding:0 4px}
  .ticker-item{flex-direction:row;height:62px;width:auto;min-width:66px;padding:0 8px;border-bottom:none;border-right:1px solid var(--border);gap:5px;flex-shrink:0}
  .ticker-item::before{left:0;right:0;top:0;bottom:auto;width:auto;height:3px}
  .ticker-item.active::after{display:none}
  /* Phase 4: fix font-size for inputs without overriding user setting */
  input[type="text"],input[type="password"],input[type="number"],select,textarea{font-size:max(16px,var(--base-font))!important}
  .detail-area{margin-left:0;padding:12px 13px 80px;height:calc(100vh - var(--header-h) - var(--subbar-h))}
  .signal-hero{flex-direction:column;gap:9px}
  .hero-ticker{font-size:21px}.hero-metrics{width:100%;grid-template-columns:1fr 1fr}.metric-val{font-size:15px}
  .wf-detail-grid{grid-template-columns:1fr 1fr}
  .wf-metrics-row{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .analytics-wrap,.settings-wrap,.learn-wrap,.portfolio-wrap{max-width:100%}
  .portfolio-add-row{flex-direction:column}.portfolio-input{min-width:unset;width:100%}
  .source-arrow{display:none}
  .outcome-card{flex-direction:column;align-items:flex-start;gap:6px}.btn-check{width:100%;text-align:center}
  /* Phase 4: show mobile-only back button */
  .mobile-only{display:inline-block}
}

@media(min-width:641px) and (max-width:1024px){
  :root{--sidebar-w:68px}
  .detail-area{padding:16px 20px}
  .hero-ticker{font-size:23px}.hero-metrics{width:175px}.metric-val{font-size:15px}
  .stat-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:1400px){
  :root{--sidebar-w:84px}
  .detail-area{padding:26px 40px}
  .hero-ticker{font-size:30px}.hero-metrics{width:220px}
  .sources-grid{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="pull-indicator" id="pullIndicator">↓ Release to reload</div>

<!-- HEADER -->
<header class="header">
  <div class="logo"><div class="logo-pulse"></div>VERTEX</div>
  <div class="hdr-div"></div>
  <div class="hdr-stats">
    <div class="stat-pill" id="marketStatus"><span class="stat-dot dot-amber"></span>Loading...</div>
    <div class="hdr-div"></div>
    <div class="hdr-cd"><div class="hdr-cd-val" id="countdown">--:--</div></div>
  </div>
  <div class="mobile-status">
    <div style="width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0"></div>
    <span id="countdownMobile">--:--</span>
  </div>
  <div class="hdr-right">
    <button class="btn-scan" id="scanBtn">▶ Scan Now</button>
  </div>
</header>

<!-- SUBBAR -->
<div class="subbar">
  <div class="tab active" data-tab="watchfile">Watchfile</div>
  <div class="tab" data-tab="signals">Signals <span class="tab-badge tab-badge-red" id="signalsBadge">0</span></div>
  <div class="tab-sep"></div>
  <div class="tab" data-tab="history">History</div>
  <div class="tab" data-tab="portfolio">Portfolio</div>
  <div class="tab" data-tab="analytics">Analytics</div>
  <div class="tab-sep"></div>
  <div class="tab" data-tab="learn">Learn</div>
  <div class="tab" data-tab="settings">⚙</div>
  <span id="scanStatus" style="font-size:9px;color:var(--muted);margin-left:4px;white-space:nowrap;flex-shrink:0"></span>
</div>

<!-- SHELL -->
<div class="shell">
  <nav class="signal-sidebar" id="signalSidebar"></nav>
  <main class="detail-area" id="detailArea"></main>
</div>

<!-- Phase 4: FAB for mobile scan -->
<button class="fab" id="fabScanBtn" aria-label="Scan Now">▶</button>

<script>
  // FAB wires to same scan action
  document.getElementById('fabScanBtn').addEventListener('click', () => {
    if (typeof haptic === 'function') haptic('medium');
    if (typeof triggerScan === 'function') triggerScan({ isManual: true });
  });
  // Keep FAB disabled state in sync with scan button
  const observer = new MutationObserver(() => {
    const fab = document.getElementById('fabScanBtn');
    const btn = document.getElementById('scanBtn');
    if (fab && btn) fab.disabled = btn.disabled;
  });
  const scanBtnEl = document.getElementById('scanBtn');
  if (scanBtnEl) observer.observe(scanBtnEl, { attributes: true });
</script>

<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
